<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Matte dark chassis -->
    <radialGradient id="bgMatte" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#1e222d"/>
      <stop offset="60%" stop-color="#12151c"/>
      <stop offset="100%" stop-color="#0a0c10"/>
    </radialGradient>

    <!-- Subtle precision border highlight -->
    <linearGradient id="edgeBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Clean, crisp drop shadow for the monogram -->
    <filter id="cleanShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- 1. Sleek Squircle Chassis -->
  <rect width="512" height="512" rx="116" fill="url(#bgMatte)"/>

  <!-- 2. Precision Chamfer Outer Rim -->
  <rect x="5" y="5" width="502" height="502" rx="112" fill="none" stroke="url(#edgeBorder)" stroke-width="2.5"/>
  <rect x="14" y="14" width="484" height="484" rx="103" fill="none" stroke="#000000" stroke-width="1.5" stroke-opacity="0.8"/>

  <!-- 3. Minimalist Controller D-Pad Accent -->
  <g transform="translate(256, 112)" fill="#38bdf8" opacity="0.9">
    <rect x="-3" y="-12" width="6" height="24" rx="3"/>
    <rect x="-12" y="-3" width="24" height="6" rx="3"/>
    <circle cx="-24" cy="0" r="2.5" fill="#94a3b8" opacity="0.5"/>
    <circle cx="24" cy="0" r="2.5" fill="#94a3b8" opacity="0.5"/>
  </g>

  <!-- 4. Modern Solid Monogram "GM" (Crisp Pure White / Off-White, No Gradient) -->
  <g filter="url(#cleanShadow)">
    <!-- Letter "G" -->
    <path fill="#ffffff" d="
      M 216 160
      C 152 160, 102 206, 102 266
      C 102 326, 152 372, 216 372
      C 268 372, 296 342, 296 298
      L 296 266
      L 208 266
      L 208 304
      L 256 304
      C 252 324, 238 334, 216 334
      C 174 334, 142 300, 142 266
      C 142 232, 174 198, 216 198
      C 244 198, 264 212, 276 230
      L 308 206
      C 288 176, 256 160, 216 160 Z
    "/>

    <!-- Letter "M" -->
    <path fill="#ffffff" d="
      M 304 372
      L 338 160
      L 374 256
      L 410 160
      L 444 372
      L 408 372
      L 392 232
      L 374 286
      L 356 232
      L 340 372 Z
    "/>
  </g>

  <!-- 5. Sleek Sub-Accent Bar -->
  <g transform="translate(256, 408)" fill="#38bdf8" opacity="0.85">
    <circle cx="-24" cy="0" r="3" fill="#94a3b8" opacity="0.4"/>
    <rect x="-14" y="-2" width="28" height="4" rx="2" fill="#38bdf8"/>
    <circle cx="24" cy="0" r="3" fill="#94a3b8" opacity="0.4"/>
  </g>
</svg>
