<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/app-icon.svg" />
    <link rel="alternate icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Steam Game Manager</title>
    <style>
      :root {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", "Noto Sans CJK SC", "Noto Sans CJK JP", "Noto Sans CJK KR", "Microsoft YaHei", Meiryo, "Malgun Gothic", sans-serif;
      }
      html.dark, [data-theme="dark"] {
        color-scheme: dark;
        background-color: #09090b;
        color: #f4f4f5;
      }
      html.light, [data-theme="light"] {
        color-scheme: light;
        background-color: #ffffff;
        color: #18181b;
      }
      body {
        margin: 0;
        padding: 0;
        overflow-x: hidden;
        font-family: inherit;
      }
      select, option, input, button {
        font-family: inherit;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
