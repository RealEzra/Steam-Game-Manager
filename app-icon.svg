<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Dark Gaming Chassis Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="40%" stop-color="#101524"/>
      <stop offset="100%" stop-color="#161b2e"/>
    </linearGradient>

    <!-- Vibrant Cyberpunk Neon Border Gradient -->
    <linearGradient id="neonRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="35%" stop-color="#0072ff"/>
      <stop offset="70%" stop-color="#7928ca"/>
      <stop offset="100%" stop-color="#ff0080"/>
    </linearGradient>

    <!-- Monogram Fill Gradient (Cyan -> Blue -> Purple -> Pink) -->
    <linearGradient id="emblemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="30%" stop-color="#0080ff"/>
      <stop offset="65%" stop-color="#7928ca"/>
      <stop offset="100%" stop-color="#ff0080"/>
    </linearGradient>

    <!-- Internal Radial Glow -->
    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#0072ff" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#7928ca" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0a0d14" stop-opacity="0"/>
    </radialGradient>

    <!-- Glowing Drop Shadow Filter -->
    <filter id="neonShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0072ff" flood-opacity="0.5"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#ff0080" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- 1. Background Squircle Canvas -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)"/>

  <!-- 2. Ambient Center Glow -->
  <circle cx="256" cy="256" r="220" fill="url(#ambientGlow)"/>

  <!-- 3. Outer Neon Accent Border -->
  <rect x="7" y="7" width="498" height="498" rx="110" fill="none" stroke="url(#neonRim)" stroke-width="4" stroke-opacity="0.75"/>

  <!-- 4. Subtle Inner Inset Bevel -->
  <rect x="15" y="15" width="482" height="482" rx="102" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.08"/>

  <!-- 5. Top Controller / Steam Valve D-Pad Accent (Pure Paths) -->
  <g transform="translate(256, 110)" fill="url(#emblemGrad)" opacity="0.9">
    <rect x="-4" y="-14" width="8" height="28" rx="3"/>
    <rect x="-14" y="-4" width="28" height="8" rx="3"/>
    <circle cx="-28" cy="0" r="3.5" opacity="0.6"/>
    <circle cx="28" cy="0" r="3.5" opacity="0.6"/>
  </g>

  <!-- 6. Stylized "GM" Vector Monogram -->
  <g filter="url(#neonShadow)">
    <!-- Letter "G" -->
    <path fill="url(#emblemGrad)" d="
      M 216 160
      C 152 160, 102 206, 102 266
      C 102 326, 152 372, 216 372
      C 268 372, 296 342, 296 298
      L 296 266
      L 208 266
      L 208 304
      L 256 304
      C 252 324, 238 334, 216 334
      C 174 334, 142 300, 142 266
      C 142 232, 174 198, 216 198
      C 244 198, 264 212, 276 230
      L 308 206
      C 288 176, 256 160, 216 160 Z
    "/>

    <!-- Letter "M" -->
    <path fill="url(#emblemGrad)" d="
      M 304 372
      L 338 160
      L 374 256
      L 410 160
      L 444 372
      L 408 372
      L 392 232
      L 374 286
      L 356 232
      L 340 372 Z
    "/>
  </g>

  <!-- 7. Bottom Gaming Chevron Bar (Pure Vector Shapes) -->
  <g transform="translate(256, 412)" fill="url(#emblemGrad)" opacity="0.85">
    <path d="M -70 0 L -40 10 L -40 4 L -65 -4 Z" opacity="0.5"/>
    <path d="M -30 0 L 0 10 L 0 4 L -25 -4 Z" opacity="0.8"/>
    <path d="M 30 0 L 0 10 L 0 4 L 25 -4 Z" opacity="0.8"/>
    <path d="M 70 0 L 40 10 L 40 4 L 65 -4 Z" opacity="0.5"/>
  </g>
</svg>
